<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página não encontrada | Clínica Marés</title>
    
    <!-- ========== FONTES ========== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    
    <!-- ========== CSS ========== -->
    <link rel="stylesheet" href="css/style.css" />
    
    <!-- ========== META ========== -->
    <meta name="robots" content="noindex, follow" />
    
    <style>
        /* Estilos específicos para a página 404 */
        .page-404 {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 24px;
            background: var(--stone-50);
        }
        
        .page-404-content {
            max-width: 580px;
        }
        
        .page-404-number {
            font-family: 'Playfair Display', ui-serif, Georgia, serif;
            font-size: 120px;
            font-weight: 700;
            color: var(--stone-200);
            line-height: 1;
            margin-bottom: 8px;
            letter-spacing: -0.03em;
        }
        
        .page-404 h1 {
            font-family: 'Playfair Display', ui-serif, Georgia, serif;
            font-size: 32px;
            font-weight: 600;
            color: var(--foreground);
            margin-bottom: 12px;
        }
        
        .page-404 p {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 17px;
            line-height: 1.7;
            color: var(--stone-700);
            margin-bottom: 24px;
        }
        
        .page-404 .btn {
            display: inline-block;
            padding: 14px 36px;
            background: var(--sage);
            color: #ffffff;
            border-radius: 9999px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(61, 107, 90, 0.2);
        }
        
        .page-404 .btn:hover {
            background: var(--sage-deep);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(61, 107, 90, 0.4);
        }
        
        .page-404 .btn svg {
            transition: transform 0.3s ease;
        }
        
        .page-404 .btn:hover svg {
            transform: translateX(4px);
        }
        
        @media (max-width: 767px) {
            .page-404-number {
                font-size: 80px;
            }
            .page-404 h1 {
                font-size: 24px;
            }
            .page-404 p {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <main>
        <section class="page-404">
            <div class="container">
                <div class="page-404-content">
                    <div class="page-404-number">404</div>
                    <h1>Página não encontrada</h1>
                    <p>
                        Ops! Parece que você tentou acessar uma página que não existe ou foi removida.
                        Mas não se preocupe, estamos aqui para ajudar você a encontrar o que procura.
                    </p>
                    <a href="/" class="btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 12H5"/>
                            <path d="M12 19l-7-7 7-7"/>
                        </svg>
                        Voltar para a página inicial
                    </a>
                    <p style="margin-top: 16px; font-size: 13px; color: var(--stone-500);">
                        📞 Precisa de ajuda? <a href="tel:+5548988728153" style="color: var(--sage-deep); font-weight: 500;">(48) 98872-8153</a>
                    </p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
